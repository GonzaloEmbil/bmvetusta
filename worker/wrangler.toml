# Cloudflare Worker que recibe las altas de abonado/a.
#
# Despliegue:
#   1. npm i -g wrangler && wrangler login
#   2. wrangler d1 create bmvetusta-abonados      → copia el database_id aquí abajo
#   3. wrangler d1 execute bmvetusta-abonados --remote --file=./schema.sql
#   4. wrangler secret put ADMIN_TOKEN            → una contraseña larga a tu elección
#   5. wrangler secret put RESEND_API_KEY         → opcional, para los avisos por correo
#   6. wrangler deploy
#
# Los secretos NUNCA van en este archivo: se guardan cifrados con `wrangler secret put`.

name = "bmvetusta-altas"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Nada de workers.dev: el Worker responde sólo en el dominio del club.
# custom_domain crea el registro DNS y la ruta al desplegar.
workers_dev = false

# Deja rastro de los console.warn: sin esto, un correo que Resend rechace
# no se ve en ningún sitio.
[observability]
enabled = true

[[routes]]
pattern = "altas.balonmanovetusta.com"
custom_domain = true

# Zona privada del club. Mismo Worker, otra puerta: comparte la base de datos
# y los secretos, así que no hay nada que duplicar ni que mantener por partida
# doble. El control de acceso lo pone Cloudflare Access por delante.
[[routes]]
pattern = "admin.balonmanovetusta.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "bmvetusta-abonados"
database_id = "c72f6ecc-1402-47e7-9d90-dc769b6e6ee8"

[vars]
# Solo se aceptan envíos desde estos orígenes.
ORIGENES = "https://balonmanovetusta.com,https://www.balonmanovetusta.com"
# Buzón del club: va en copia de cada alta y recibe las respuestas.
AVISO_A = "balonmanovetusta@gmail.com"
# Remitente de los correos. El dominio debe estar verificado en el proveedor;
# no hace falta que exista el buzón, basta con ser dueño del dominio.
AVISO_DE = "socios@balonmanovetusta.com"
# El dominio no recibe correo, así que las respuestas se dirigen a AVISO_A.

# ── Cloudflare Access ──
# Emisores aceptados para los testigos de la zona privada. Van dos porque el
# equipo se renombró y Cloudflare sigue firmando con el nombre anterior los
# testigos ya emitidos. Las claves públicas se piden al primero.
ACCESS_EQUIPO = "balonmanovetusta.cloudflareaccess.com,purple-dew-ca4c.cloudflareaccess.com"
# Identificador de la aplicación de Access. Sin él no se entra: el Worker
# falla cerrado a propósito. Se copia del panel de la aplicación (Application
# Audience Tag).
ACCESS_AUD = "1682a850cc47f07a3b6fb7e01436b4782026d8d1dd2acc2578776c6c81b264d1"
# Segunda lista, además de la política de Access. Si allí se colase alguien
# por un error de configuración, aquí se para.
ACCESS_CORREOS = "gonzalomembil@gmail.com,gmembil@gmail.com,gonzalo.martinez@bookline.ai,balonmanovetusta@gmail.com,heviaembilmaria93@gmail.com,onaitz@gmail.com"

# Cloudflare Worker que recibe las altas de abonado/a.
#
# Despliegue:
#   1. npm i -g wrangler && wrangler login
#   2. wrangler d1 create bmvetusta-abonados      → copia el database_id aquí abajo
#   3. wrangler d1 execute bmvetusta-abonados --remote --file=./schema.sql
#   4. wrangler secret put ADMIN_TOKEN            → una contraseña larga a tu elección
#   5. wrangler secret put RESEND_API_KEY         → opcional, para los avisos por correo
#   6. wrangler deploy
#
# Los secretos NUNCA van en este archivo: se guardan cifrados con `wrangler secret put`.

name = "bmvetusta-altas"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Nada de workers.dev: el Worker responde sólo en el dominio del club.
# custom_domain crea el registro DNS y la ruta al desplegar.
workers_dev = false

# Deja rastro de los console.warn: sin esto, un correo que Resend rechace
# no se ve en ningún sitio.
[observability]
enabled = true

[[routes]]
pattern = "altas.balonmanovetusta.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "bmvetusta-abonados"
database_id = "c72f6ecc-1402-47e7-9d90-dc769b6e6ee8"

[vars]
# Solo se aceptan envíos desde estos orígenes.
ORIGENES = "https://balonmanovetusta.com,https://www.balonmanovetusta.com"
# Destinatario de los avisos de alta.
AVISO_A = "balonmanovetusta@gmail.com"
# Remitente de los correos. Debe ser un dominio verificado en el proveedor.
AVISO_DE = "altas@balonmanovetusta.com"
# El dominio no recibe correo, así que las respuestas se dirigen a AVISO_A.
# Excepción: el aviso al club se responde al abonado.
